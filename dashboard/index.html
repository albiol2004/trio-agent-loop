<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Trio Loops</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%230B1214'/%3E%3Crect%20x='3' y='6' width='4' height='4' rx='1' fill='%233FBF8F'/%3E%3Crect%20x='9' y='6' width='4' height='4' rx='1' fill='%23E8A33D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <h1>Trio Loops</h1>
      <p class="brand-sub">mission control for agent loops</p>
    </div>
    <div class="topbar-meta">
      <span id="agg-loops" class="agg">&mdash; loops</span>
      <span id="agg-active" class="agg">&mdash; active</span>
      <span id="updated-at" class="updated-at">updated &mdash;</span>
      <span id="board-status" class="board-status status-idle"><span id="board-status-text">connecting&hellip;</span></span>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Filter loops by state"></nav>

  <main class="board" aria-label="Loop board">
    <div id="board-error" class="board-error" hidden></div>
    <section id="inbox" class="inbox" hidden aria-label="Attention inbox">
      <h2 class="inbox-title">Needs attention <span id="inbox-count" class="inbox-count"></span></h2>
      <div id="inbox-list" class="inbox-list"></div>
    </section>
    <div id="card-grid" class="card-grid"></div>
  </main>

  <div id="drawer-scrim" class="drawer-scrim" hidden></div>
  <div id="drawer" class="drawer modal" hidden role="dialog" aria-modal="true" aria-label="Loop detail">
    <header class="drawer-header">
      <div class="drawer-heading">
        <span id="drawer-badge" class="status-label status-idle">IDLE</span>
        <h2 id="drawer-name" class="drawer-name">&mdash;</h2>
      </div>
      <button id="drawer-close" class="icon-btn" type="button" title="Close detail (Esc)" aria-label="Close detail">&times;</button>
    </header>

    <nav id="drawer-tabs" class="drawer-tabs" aria-label="Loop detail views"></nav>

    <div class="drawer-body">
      <div id="view-overview" class="drawer-view">
        <p id="drawer-mission" class="drawer-mission"></p>

        <dl class="facts" aria-label="Loop facts">
          <div class="fact"><dt>Iteration</dt><dd id="fact-iter" class="mono">&mdash;</dd></div>
          <div class="fact"><dt>Verdict</dt><dd id="fact-verdict">&mdash;</dd></div>
          <div class="fact"><dt>Last activity</dt><dd id="fact-activity">&mdash;</dd></div>
          <div class="fact"><dt>Sessions</dt><dd id="fact-sessions" class="mono">&mdash;</dd></div>
        </dl>

        <section class="drawer-section" aria-label="Verdict history">
          <h3 class="section-label">Verdict history</h3>
          <div id="drawer-strip" class="strip strip-large"></div>
        </section>

        <section id="commits-section" class="drawer-section" aria-label="Commits" hidden>
          <h3 class="section-label">Commits</h3>
          <div id="commit-list" class="commit-list"></div>
        </section>

        <section class="drawer-section" aria-label="Activity timeline">
          <h3 class="section-label">Activity</h3>
          <div id="drawer-timeline" class="timeline"></div>
        </section>


      </div>

      <div id="view-timeline" class="drawer-view" hidden></div>
      <div id="view-files" class="drawer-view" hidden></div>
      <div id="view-graph" class="drawer-view" hidden></div>
      <div id="view-transcripts" class="drawer-view drawer-view-fill" hidden>
        <div class="chat-layout">
          <aside class="chat-sessions" aria-label="Sessions">
            <div class="chat-sessions-head">
              <h3 class="section-label">Sessions</h3>
              <span id="pane-status" class="stream-status status-idle"><span id="pane-status-text">idle</span></span>
            </div>
            <div id="session-list" class="session-list"></div>
          </aside>
          <div class="chat-main">
            <div id="transcript-view" class="transcript-view transcript-chat" role="log" aria-label="Session transcript" tabindex="0"></div>
            <div id="transcript-notice" class="transcript-notice" hidden></div>
            <div class="pane-footer">
              <button id="follow-btn" class="follow-btn" type="button" aria-pressed="true">Pause follow</button>
              <span id="offset-hint" class="offset-hint mono">offset 0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <noscript>This dashboard requires JavaScript.</noscript>
</div>
</body>
</html>
