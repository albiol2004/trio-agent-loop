<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Registry Health · Trio Loops</title>
<link rel="stylesheet" href="/app.css">
<script src="/nav.js" defer></script>
<script src="/health.js" defer></script>
<style>
  .health-topbar { position: sticky; top: 0; z-index: 10; }
  .health-topbar a { color: var(--blue); text-decoration: none; }
  .health-topbar a:hover {
    color: var(--text); text-decoration: underline; text-underline-offset: 3px;
  }
  .health-topbar .page-state { color: var(--faint); }
  .health-topbar .page-state.is-error { color: var(--red); }
  .health-shell { min-height: 100vh; display: flex; flex-direction: column; }
  .health-layout {
    width: 100%; max-width: 1680px; margin: 0 auto; padding: 18px 22px 42px;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px; flex: 1;
  }
  .health-section {
    min-width: 0; background: var(--surface); border: 1px solid var(--border);
  }
  .health-section-wide { grid-column: 1 / -1; }
  .health-heading {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 16px; border-bottom: 1px solid var(--border);
  }
  .health-heading h2 {
    margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  }
  .health-list { display: flex; flex-direction: column; }
  .health-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .health-item:last-child { border-bottom: 0; }
  .health-name { margin: 0 0 8px; font-size: 13px; }
  .health-hops { display: grid; gap: 6px; margin: 0; }
  .health-hop {
    display: grid; grid-template-columns: 150px 1fr auto; gap: 10px;
    align-items: baseline; font: 11px var(--mono);
  }
  .health-role { color: var(--muted); }
  .health-path { color: var(--faint); overflow-wrap: anywhere; }
  .health-empty { padding: 16px; color: var(--faint); font-size: 12px; }
  .health-generate-body { padding: 14px 16px; }
  .health-generate-body pre {
    margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
    color: var(--muted); font: 11px/1.5 var(--mono);
  }
  .health-dangling-item {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--border);
  }
  .health-dangling-path { color: var(--muted); font: 11px var(--mono); }
  .health-delete {
    padding: 3px 8px; color: var(--red); background: var(--surface-2);
    border: 1px solid var(--red); border-radius: 3px; cursor: pointer;
    font: 10px var(--mono);
  }
  @media (max-width: 800px) {
    .health-layout { grid-template-columns: 1fr; padding: 12px 10px 28px; }
    .health-section-wide { grid-column: auto; }
    .health-hop { grid-template-columns: 1fr auto; }
    .health-role { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="app" class="health-shell">
  <header class="topbar health-topbar">
    <div class="brand">
      <h1><a href="/">Trio Loops</a> · Registry Health</h1>
      <p class="brand-sub">trace lineage, installs, manifests, and drift</p>
    </div>
    <div id="topbar-meta" class="topbar-meta">
      <a href="/skills.html" aria-label="Open skills registry">Skills</a>
      <a href="/agents.html" aria-label="Open agent install matrix">Agents</a>
      <a href="/topology.html" aria-label="Open harness topology">Topology</a>
      <a href="/models.html" aria-label="Open model registry">Models</a>
      <a href="/health.html" aria-label="Open registry health">Health</a>
      <span id="page-state" class="page-state">waiting for workspace…</span>
    </div>
  </header>

  <main class="health-layout" aria-label="Registry health workspace">
    <section class="health-section health-section-wide"
             aria-labelledby="lineage-heading">
      <div class="health-heading">
        <h2 id="lineage-heading">Lineage</h2>
      </div>
      <div id="health-lineage" class="health-list"></div>
    </section>

    <section class="health-section" aria-labelledby="manifests-heading">
      <div class="health-heading">
        <h2 id="manifests-heading">Manifests</h2>
      </div>
      <div id="health-manifests" class="health-list"></div>
    </section>

    <section class="health-section" aria-labelledby="installed-heading">
      <div class="health-heading">
        <h2 id="installed-heading">Installed harnesses</h2>
      </div>
      <div id="health-installed" class="health-list"></div>
    </section>

    <section class="health-section health-section-wide"
             aria-labelledby="generate-heading">
      <div class="health-heading">
        <h2 id="generate-heading">Generator check</h2>
      </div>
      <div id="health-generate" class="health-generate-body"></div>
    </section>

    <section class="health-section health-section-wide"
             aria-labelledby="dangling-heading">
      <div class="health-heading">
        <h2 id="dangling-heading">Dangling artifacts</h2>
      </div>
      <div id="health-dangling" class="health-list"></div>
    </section>
  </main>
</div>
</body>
</html>
