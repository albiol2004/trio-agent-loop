<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Model Registry · Trio Loops</title>
<link rel="stylesheet" href="/app.css">
<script src="/nav.js" defer></script>
<script src="/models.js" defer></script>
<style>
  .models-topbar { position: sticky; top: 0; z-index: 10; }
  .models-topbar a { color: var(--blue); text-decoration: none; }
  .models-topbar a:hover {
    color: var(--text); text-decoration: underline; text-underline-offset: 3px;
  }
  .models-topbar .page-state { color: var(--faint); }
  .models-topbar .page-state.is-error { color: var(--red); }
  .models-shell { min-height: 100vh; display: flex; flex-direction: column; }
  .models-layout {
    width: 100%; max-width: 1680px; margin: 0 auto; padding: 18px 22px 42px;
    flex: 1;
  }
  .models-pane {
    background: var(--surface); border: 1px solid var(--border);
  }
  .models-heading {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 16px; border-bottom: 1px solid var(--border);
  }
  .models-heading h2 {
    margin: 0; font-size: 13px; letter-spacing: .12em;
    text-transform: uppercase;
  }
  .models-note { margin: 0; color: var(--muted); font-size: 12px; }
  .models-table-wrap { overflow-x: auto; padding: 0 16px 16px; }
  #models-table {
    border-collapse: collapse; width: 100%; min-width: 720px;
    font-size: 12.5px;
  }
  #models-table th, #models-table td {
    padding: 10px; border-bottom: 1px solid var(--border);
    text-align: left; vertical-align: top;
  }
  #models-table thead th {
    color: var(--faint); font: 10.5px var(--mono);
    letter-spacing: .06em; text-transform: uppercase;
  }
  .model-input {
    width: min(280px, 100%); padding: 5px 7px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; font: 12px var(--mono);
  }
  .model-input:focus { outline: none; border-color: var(--amber); }
  .model-save {
    margin-left: 7px; padding: 5px 9px; color: var(--green);
    background: var(--surface-2); border: 1px solid var(--green);
    border-radius: 3px; font: 11px var(--mono); cursor: pointer;
  }
  .model-save:hover { color: var(--bg); background: var(--green); }
  .model-save:disabled { opacity: .55; cursor: wait; }
  .model-detail { display: block; color: var(--faint); font: 10px var(--mono); }
  .model-warning {
    display: inline-block; margin-left: 7px; color: var(--amber);
    font: 10px var(--mono);
  }
  .model-availability-known { color: var(--green); }
  .model-availability-unknown { color: var(--amber); }
  .models-empty { padding: 24px 10px; color: var(--muted); }
  @media (max-width: 720px) {
    .models-layout { padding: 12px 10px 28px; }
  }
</style>
</head>
<body>
<div id="app" class="models-shell">
  <header class="topbar models-topbar">
    <div class="brand">
      <h1><a href="/">Trio Loops</a> · Model Registry</h1>
      <p class="brand-sub">resolve and inspect agent model selections</p>
    </div>
    <div id="topbar-meta" class="topbar-meta">
      <a href="/skills.html" aria-label="Open skills registry">Skills</a>
      <a href="/agents.html" aria-label="Open agent install matrix">Agents</a>
      <a href="/topology.html" aria-label="Open harness topology">Topology</a>
      <a href="/health.html" aria-label="Open registry health">Health</a>
      <span id="page-state" class="page-state">waiting for workspace…</span>
    </div>
  </header>

  <main class="models-layout" aria-label="Model registry workspace">
    <section class="models-pane" aria-labelledby="models-heading">
      <div class="models-heading">
        <h2 id="models-heading">Resolved Models</h2>
        <p class="models-note">Frontmatter wins; runtime overrides are read-only.</p>
      </div>
      <div class="models-table-wrap">
        <table id="models-table">
          <thead>
            <tr>
              <th scope="col">Harness</th>
              <th scope="col">Agent</th>
              <th scope="col">Model</th>
              <th scope="col">Layer</th>
              <th scope="col">Availability</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
