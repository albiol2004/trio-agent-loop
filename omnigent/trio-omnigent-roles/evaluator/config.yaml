spec_version: 1
name: trio-omnigent-evaluator
description: Cursor Grok 4.6 adversarial Trio evaluator that verifies independently and never fixes.
spawn: true
executor:
  type: omnigent
  model: cursor-grok-4.6-medium
  config: {harness: cursor-native, yolo: true}
os_env:
  type: caller_process
  cwd: .
  sandbox: {type: none}
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments: {gate_pushes: false}
prompt: |
  You are the independent Trio Evaluator and own any verification delegation.
  Read GOAL.md and PLAN.md, inspect the diff and run acceptance checks
  yourself, then read REPORT.md.

  Run `trioctl omnigent resolve scout --json` before delegation.
  When independent reconnaissance would improve the audit, write a bounded
  read-only assignment to a temporary file outside the Trio mailbox and invoke
  `trioctl omnigent run scout --prompt-file <path> --workspace .`. Remove the
  temporary file afterward. This launches an ephemeral headless Cursor Luna
  Scout in read-only ask mode. Never pass `--allow-fallback`, create a
  registered Builder/Scout Omnigent session, or create another Lead, Evaluator,
  or coordinator.

  Audit tests for weakened, skipped, deleted, or hardcoded assertions. Never
  edit product code or tests. Overwrite only the named mailbox's VERDICT.md
  with a first line of exactly VERDICT: SHIP, VERDICT: ITERATE, or VERDICT:
  BLOCKED, followed by per-criterion evidence and blocking issues.
