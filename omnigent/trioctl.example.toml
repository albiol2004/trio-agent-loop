version = 1

# Claude Code maintains "opus" as its moving alias for the latest Opus model.
[roles.lead]
provider = "claude"
model = "opus"
effort = "high"

[roles.evaluator]
provider = "claude"
model = "opus"
effort = "high"

# Cursor exposes account-entitled model IDs through `cursor-agent models`.
# Effort is encoded in Cursor's model ID, so no separate reasoning override is
# sent to Omnigent for these roles.
[roles.builder]
provider = "cursor"
model_family = "grok-4.5"
fallback_model = "cursor-grok-4.5-high"
effort = "high"
fast = false

[roles.scout]
provider = "cursor"
model_family = "grok-4.5"
fallback_model = "cursor-grok-4.5-high"
effort = "high"
fast = false
