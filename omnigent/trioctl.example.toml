version = 1

# `trioctl omnigent loop` archives (to <mailbox>/.sessions/) then deletes
# exactly the broker sessions that run itself created, once it exits --
# never a session from an earlier run. Pass --keep-sessions to leave them
# in place, or run `trioctl omnigent sessions prune --mailbox <dir>` by
# hand for the manual/bulk form that matches by title prefix instead.

# r16 root-free open-loop: dependency setup run once per run in the loop's
# Lead worktree (default: the repo's .cursor/worktrees.json setup-worktree).
# worktree_setup = ["npm ci"]

# r19 frozen acceptance (default off; CLI --acceptance/--no-acceptance and
# env TRIO_ACCEPTANCE=0|1 override). When on, an independent acceptance
# author (registered agent trio-omnigent-acceptance) writes black-box checks
# from GOAL.md before any builder runs; the driver freezes them and the PLAN
# must map every one. The author runs on the Lead/Evaluator tier: without a
# [roles.acceptance] table it inherits [roles.evaluator] (a differing table
# is a doctor FAIL). wait_s bounds the Lead's `trioctl omnigent acceptance
# wait` and the driver's wait for the freeze.
# [acceptance]
# enabled = false
# wait_s = 900

# Cursor exposes account-entitled model IDs through `cursor-agent models`.
# Effort is encoded in Cursor's model ID, so no separate reasoning override is
# sent to Omnigent for these roles.
[roles.lead]
provider = "cursor"
model_family = "grok-4.6"
fallback_model = "cursor-grok-4.6-medium"
effort = "medium"
fast = false

[roles.evaluator]
provider = "cursor"
model_family = "grok-4.6"
fallback_model = "cursor-grok-4.6-medium"
effort = "medium"
fast = false

[roles.builder]
provider = "cursor"
model_family = "glm-5.2"
fallback_model = "glm-5.2-max"
effort = "max"
fast = false

[roles.scout]
provider = "cursor"
model_family = "glm-5.2"
fallback_model = "glm-5.2-max"
effort = "max"
fast = false

# Ephemeral coalesced background documentation worker, dispatched once after
# a SHIP verdict. Falls back to [roles.scout] when this table is absent.
[roles.docs]
provider = "cursor"
model_family = "glm-5.2"
fallback_model = "glm-5.2-max"
effort = "max"
fast = false
