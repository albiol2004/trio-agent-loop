version = 1

# Headless `trioctl omnigent loop` runs pile up broker sessions forever;
# add `--prune-sessions` to archive each iteration's session under
# <mailbox>/.sessions/ and delete it from the broker once the loop exits
# (or run `trioctl omnigent sessions prune --mailbox <dir>` by hand).

# Cursor exposes account-entitled model IDs through `cursor-agent models`.
# Effort is encoded in Cursor's model ID, so no separate reasoning override is
# sent to Omnigent for these roles.
[roles.lead]
provider = "cursor"
model_family = "grok-4.6"
fallback_model = "cursor-grok-4.6-medium"
effort = "medium"
fast = false

[roles.evaluator]
provider = "cursor"
model_family = "grok-4.6"
fallback_model = "cursor-grok-4.6-medium"
effort = "medium"
fast = false

[roles.builder]
provider = "cursor"
model_family = "gpt-5.6-luna"
fallback_model = "gpt-5.6-luna-max"
effort = "max"
fast = false

[roles.scout]
provider = "cursor"
model_family = "gpt-5.6-luna"
fallback_model = "gpt-5.6-luna-max"
effort = "max"
fast = false

# Ephemeral coalesced background documentation worker, dispatched once after
# a SHIP verdict. Falls back to [roles.scout] when this table is absent.
[roles.docs]
provider = "cursor"
model_family = "gpt-5.6-luna"
fallback_model = "gpt-5.6-luna-max"
effort = "max"
fast = false
